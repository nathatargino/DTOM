name: Deploy DTOM to Azure

on:
  push:
    branches:
      - master # Mude para 'main' se sua branch principal for main

permissions:
  contents: read

env:
  AZURE_WEBAPP_NAME: DTOM
  AZURE_WEBAPP_PACKAGE_PATH: '.' # Caminho simplificado
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: '8.0.x'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore, Build and Publish
        run: |
          dotnet restore
          dotnet build --configuration ${{ env.CONFIGURATION }}
          dotnet publish --configuration ${{ env.CONFIGURATION }} --output ./publish

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp
          path: ./publish

  deploy:
    runs-on: windows-latest
    needs: build
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp
          path: ./webapp

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./webapp
